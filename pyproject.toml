[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchgaiaxp"
version = "0.3.0"
description = "Gaia XP spectra in PyTorch: continuous, batched, differentiable, on any device (GaiaXPy 2.2+ parity, DR4-ready)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "pyarrow>=14"]

[project.optional-dependencies]
# Build-time (scripts/build_assets.py), FITS/VOTable/YAML I/O, and parity tests.
io = ["astropy>=6", "pyyaml>=6"]
gaiaxpy = ["gaiaxpy>=2.2", "scipy>=1.10", "pandas>=2", "pyyaml>=6"]
test = ["pytest>=8", "gaiaxpy>=2.2", "pandas>=2", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torchgaiaxp = ["_assets/*/*.npz", "_assets/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
