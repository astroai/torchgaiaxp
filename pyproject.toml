[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchgaiaxp"
version = "0.3.0"
description = "Gaia XP spectra in PyTorch: continuous, batched, differentiable, on any device (GaiaXPy 2.2+ parity, DR4-ready)."
authors = [{ name = "Sébastien Fabbro", email = "sebastien.fabbro@nrc-cnrc.gc.ca" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-GAIAXPY"]
keywords = ["gaia", "astronomy", "spectroscopy", "pytorch", "torchfits", "gaiaxpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "torchfits>=1.3",
    "pyarrow>=14",
    "pandas>=2",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "fastavro>=1.9",
]

[project.urls]
Homepage = "https://github.com/astroai/torchgaiaxp"
Repository = "https://github.com/astroai/torchgaiaxp"

[project.optional-dependencies]
dev = ["pytest>=8", "gaiaxpy>=2.2", "scipy>=1.10", "astropy>=6", "ruff"]
test = ["pytest>=8", "gaiaxpy>=2.2", "scipy>=1.10", "astropy>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torchgaiaxp = ["_assets/*/*.npz", "_assets/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
